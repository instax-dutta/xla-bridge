[build-system]
requires = ["uv_build>=0.7.0,<1.0.0"]
build-backend = "uv_build"

[project]
name = "xla-bridge"
version = "0.1.0"
description = "Eager inference and model surgery for Hugging Face Transformers on TPUs via PyTorch/XLA"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Abhishek Dash" }]
keywords = ["tpu", "xla", "transformers", "inference", "lora", "fsdp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.4"]
transformers = ["transformers>=4.50", "peft>=0.14"]
tpu = ["torch_xla>=2.8"]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/instax-dutta/xla-bridge"

[tool.uv.build-backend]
module-name = "xla_bridge"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
# Blind exception catches and silent except-pass are intentional throughout:
# torch_xla raises heterogeneous errors across versions, and hardware
# detection must degrade gracefully on any host instead of crashing.
ignore = ["BLE001", "S110"]
